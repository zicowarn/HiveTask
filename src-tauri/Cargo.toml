[package]
name = "hivetask"
version = "0.1.0"
description = "HiveTask — cross-platform desktop project management tool"
authors = ["zicowarn"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hivetask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
git2 = "0.21.0"
portable-pty = "0.9.0"
tauri-plugin-log = "2.0.0-rc.2"
log = "0.4.34"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
encoding_rs = "0.8.35"
chardetng = "1.0.0"
trash = "5.2.3"
chinese-lunisolar-calendar = "0.2.5"
# 「打开方式」的系统来源：读 .app 的 Info.plist（二进制/XML 都认）
plist = "1"
tauri-plugin-clipboard-manager = "2.1.0-beta.7"
# 日程本地通知（S4）：到点弹系统通知；凭据/账户零依赖
tauri-plugin-notification = "2"
# LaunchServices（Finder「打开方式」那张表）：只在 macOS 用，见 openwith_apps.rs
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
